# Decap CMS. Run `npx decap-server` next to `npm run dev`, then open http://localhost:5173/admin/
local_backend: true

backend:
  name: github
  repo: uuuujangkedu/3d-portfolio-website
  branch: main
  # Production login needs an OAuth relay. See "Admin panel" in README.

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: content
    label: Site content
    files:
      - name: site
        label: Portfolio
        file: src/data/content.json
        fields:
          - name: seo
            label: SEO
            widget: object
            fields:
              - { name: title, label: Browser tab title, widget: string }
          - name: loader
            label: Loading screen
            widget: object
            fields:
              - { name: initials, label: Loader initials, widget: string }
              - name: marqueeWords
                label: Scrolling words
                widget: list
                default: [Developer]
          - name: navbar
            label: Navbar
            widget: object
            fields:
              - { name: initials, label: Initials, widget: string }
              - { name: connectUrl, label: Top-right link URL, widget: string }
              - { name: connectLabel, label: Top-right link text, widget: string }
              - name: links
                label: Menu links
                widget: list
                summary: "{{fields.label}} → {{fields.href}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: "Anchor (e.g. #work)", widget: string }
          - name: landing
            label: Landing
            widget: object
            fields:
              - { name: greeting, label: Greeting, widget: string }
              - { name: firstName, label: Name line 1, widget: string }
              - { name: lastName, label: Name line 2, widget: string }
              - { name: roleIntro, label: Role line, widget: string }
              - { name: rolePrimary, label: Role word A, widget: string }
              - { name: roleSecondary, label: Role word B, widget: string }
          - name: about
            label: About
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: paragraph, label: Paragraph, widget: text }
          - name: whatIDo
            label: What I do
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string }
              - { name: description, label: Description, widget: text }
              - { name: tags, label: Tags, widget: list, default: [Skill] }
          - name: career
            label: Career
            widget: list
            summary: "{{fields.role}} · {{fields.company}}"
            fields:
              - { name: role, label: Role, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: period, label: Period, widget: string }
              - { name: description, label: Description, widget: text }
          - name: work
            label: Projects
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: category, label: Category, widget: string }
              - { name: tools, label: Tools & features, widget: string }
              - { name: image, label: Image, widget: image }
              - { name: link, label: Link, widget: string }
          - name: techStack
            label: Tech stack
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: images, label: Images, widget: list, default: [] }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: connectHeading, label: Connect heading, widget: string }
              - name: connectLink
                label: Connect link
                widget: object
                fields:
                  - { name: label, label: Text, widget: string }
                  - { name: url, label: URL, widget: string }
              - { name: educationHeading, label: Education heading, widget: string }
              - { name: education, label: Education lines, widget: list, default: ["University"] }
              - { name: statusHeading, label: Status heading, widget: string }
              - { name: status, label: Status, widget: string }
              - { name: socialHeading, label: Social heading, widget: string }
              - name: socials
                label: Social links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: url, label: URL, widget: string }
              - { name: creditName, label: Credit name, widget: string }
              - { name: year, label: Year, widget: string }
          - name: social
            label: Social icons & resume
            widget: object
            fields:
              - name: icons
                label: Icons
                widget: list
                summary: "{{fields.icon}}"
                fields:
                  - name: icon
                    label: Icon
                    widget: select
                    options: [github, linkedin, instagram, youtube]
                  - { name: url, label: URL, widget: string }
              - { name: resume, label: Resume file path, widget: string }
              - { name: showResume, label: Show resume button, widget: boolean, default: true }
